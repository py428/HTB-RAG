<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTB Wiki AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #343541;
            color: #ececf1;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #565869;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #10a37f;
        }
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message {
            display: flex;
            gap: 15px;
            padding: 20px;
            border-radius: 8px;
        }
        .message.user {
            background-color: #343541;
        }
        .message.ai {
            background-color: #444654;
        }
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .avatar.user-avatar {
            background-color: #5436DA;
        }
        .avatar.ai-avatar {
            background-color: #10a37f;
        }
        .message-content {
            flex-grow: 1;
            line-height: 1.6;
        }
        .input-container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .input-box {
            display: flex;
            background-color: #40414f;
            border-radius: 8px;
            border: 1px solid #565869;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            flex-grow: 1;
            background: transparent;
            border: none;
            padding: 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background: transparent;
            border: none;
            padding: 16px;
            color: #10a37f;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            color: #1a7f64;
        }
        .loading {
            display: none;
            color: #8e8ea0;
            font-size: 14px;
        }
        pre {
            background-color: #1e1e2f;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        code {
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>HTB Wiki Security Analyst</h1>
        <p style="color: #8e8ea0; margin-top: 5px; font-size: 14px;">Ask me questions about HackTheBox writeups</p>
    </div>

    <div class="chat-container" id="chat-container">
        <div class="message ai">
            <div class="avatar ai-avatar">AI</div>
            <div class="message-content">
                Hello! I am connected to the HTB RAG pipeline. How can I help you today? Try asking me one of your 15 test questions.
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="loading" id="loading">Thinking... (This may take a few seconds)</div>
        <div class="input-box">
            <input type="text" id="query-input" placeholder="e.g. Which machine has no modifiable services identified by winPEAS?" onkeypress="handleKeyPress(event)">
            <button onclick="sendQuery()">&#10148;</button>
        </div>
    </div>

    <script>
        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            input.value = '';
            
            addMessage('User', query, 'user');
            
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                
                const htmlAnswer = marked.parse(data.answer);
                addMessage('AI', htmlAnswer, 'ai', true);
            } catch (error) {
                addMessage('AI', 'Error connecting to the API. Make sure backend is running.', 'ai');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function addMessage(sender, text, type, isHtml = false) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = `avatar ${type}-avatar`;
            avatarDiv.innerText = sender === 'User' ? 'U' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (isHtml) {
                contentDiv.innerHTML = text;
            } else {
                contentDiv.innerText = text;
            }

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendQuery();
            }
        }
    </script>
</body>
</html>
