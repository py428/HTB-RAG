<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTB Wiki AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #343541;
            color: #ececf1;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #565869;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #10a37f;
        }
        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message {
            display: flex;
            gap: 15px;
            padding: 20px;
            border-radius: 8px;
            min-width: 0;
        }
        .message.user {
            background-color: #343541;
        }
        .message.ai {
            background-color: #444654;
        }
        .avatar {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            border-radius: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            font-family: Inter, 'Segoe UI', sans-serif;
            isolation: isolate;
        }
        .avatar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.42), transparent 42%);
            z-index: -1;
        }
        .avatar::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: inherit;
            box-sizing: border-box;
            pointer-events: none;
        }
        .avatar-mark {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .avatar.user-avatar {
            background: linear-gradient(145deg, #8b5cf6 0%, #5b5ce2 52%, #3b43c6 100%);
            box-shadow: 0 8px 18px rgba(82, 71, 214, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .user-avatar .avatar-mark {
            width: 21px;
            height: 21px;
            border: 1px solid rgba(255, 255, 255, 0.48);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            font-weight: 800;
            text-shadow: 0 1px 4px rgba(25, 18, 94, 0.35);
        }
        .avatar.ai-avatar {
            background: linear-gradient(145deg, #18d7a0 0%, #0da984 52%, #087c72 100%);
            box-shadow: 0 8px 18px rgba(13, 169, 132, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.24);
        }
        .ai-avatar .avatar-mark {
            font-size: 12px;
            font-weight: 850;
            letter-spacing: -0.65px;
            text-shadow: 0 1px 5px rgba(0, 66, 55, 0.38);
        }
        .ai-avatar .avatar-mark::before {
            content: '';
            position: absolute;
            width: 25px;
            height: 15px;
            border: 1px solid rgba(218, 255, 246, 0.42);
            border-radius: 50%;
            transform: rotate(-32deg);
            z-index: -1;
        }
        .avatar-spark {
            position: absolute;
            top: -7px;
            right: -8px;
            width: 4px;
            height: 4px;
            border-radius: 1px;
            background: #ffffff;
            box-shadow: 0 0 7px rgba(255, 255, 255, 0.95);
            transform: rotate(45deg);
        }
        .message-content {
            flex-grow: 1;
            min-width: 0;
            line-height: 1.6;
            font-size: 15px;
            overflow-wrap: anywhere;
        }
        .message-content > :first-child {
            margin-top: 0;
        }
        .message-content > :last-child {
            margin-bottom: 0;
        }
        .message-content p {
            margin: 0 0 12px;
        }
        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin: 20px 0 10px;
            color: #f7f7f8;
            line-height: 1.3;
        }
        .message-content h1 {
            font-size: 20px;
        }
        .message-content h2 {
            font-size: 18px;
        }
        .message-content h3,
        .message-content h4 {
            font-size: 16px;
        }
        .message-content ul,
        .message-content ol {
            margin: 10px 0 14px;
            padding-left: 24px;
        }
        .message-content li {
            padding-left: 3px;
        }
        .message-content li + li {
            margin-top: 8px;
        }
        .message-content strong {
            color: #ffffff;
        }
        .message-content a {
            color: #5ee0bd;
            text-underline-offset: 3px;
        }
        .message-content blockquote {
            margin: 14px 0;
            padding: 10px 14px;
            border-left: 3px solid #19c79a;
            border-radius: 0 6px 6px 0;
            background: rgba(16, 163, 127, 0.08);
            color: #d9d9e3;
        }
        .table-scroll {
            width: 100%;
            max-width: 100%;
            margin: 14px 0;
            overflow-x: auto;
            border: 1px solid #5d6070;
            border-radius: 9px;
            scrollbar-width: thin;
            scrollbar-color: #77798a #393b48;
        }
        .message-content table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            background: rgba(32, 33, 43, 0.35);
            font-size: 14px;
        }
        .message-content th,
        .message-content td {
            padding: 11px 12px;
            border-right: 1px solid #565968;
            border-bottom: 1px solid #565968;
            text-align: left;
            vertical-align: top;
            overflow-wrap: anywhere;
        }
        .message-content th {
            background: #383a47;
            color: #72e4c4;
            font-size: 12px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .message-content tr:last-child td {
            border-bottom: none;
        }
        .message-content th:last-child,
        .message-content td:last-child {
            border-right: none;
        }
        .input-container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .input-box {
            display: flex;
            background-color: #40414f;
            border-radius: 8px;
            border: 1px solid #565869;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        input[type="text"] {
            flex-grow: 1;
            background: transparent;
            border: none;
            padding: 16px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background: transparent;
            border: none;
            padding: 16px;
            color: #10a37f;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            color: #1a7f64;
        }
        .loading {
            display: none;
            color: #8e8ea0;
            font-size: 14px;
        }
        pre {
            background-color: #1e1e2f;
            margin: 12px 0;
            padding: 14px;
            border: 1px solid #4f5261;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre;
        }
        code {
            font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
            font-size: 0.9em;
        }
        :not(pre) > code {
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(20, 21, 28, 0.55);
            color: #9af0d8;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        @media (max-width: 640px) {
            .header {
                padding: 14px 12px;
            }
            .header h1 {
                font-size: 20px;
            }
            .chat-container {
                padding: 12px;
                gap: 12px;
            }
            .message {
                gap: 11px;
                padding: 14px 12px;
                border-radius: 9px;
            }
            .avatar {
                width: 32px;
                height: 32px;
                flex-basis: 32px;
                border-radius: 10px;
            }
            .message-content {
                font-size: 14px;
                line-height: 1.55;
            }
            .input-container {
                padding: 12px;
            }
            .table-scroll {
                overflow: visible;
                border: none;
                border-radius: 0;
                background: transparent;
            }
            .message-content table,
            .message-content tbody,
            .message-content tr,
            .message-content td {
                display: block;
                width: 100%;
                min-width: 0;
            }
            .message-content thead {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            .message-content tbody tr {
                padding: 6px 10px;
                border: 1px solid #5b5e6d;
                border-radius: 9px;
                background: rgba(32, 33, 43, 0.42);
            }
            .message-content tbody tr + tr {
                margin-top: 10px;
            }
            .message-content td {
                display: grid;
                grid-template-columns: minmax(88px, 35%) minmax(0, 1fr);
                gap: 10px;
                padding: 9px 0;
                border-right: 0;
                border-bottom: 1px solid #535664;
            }
            .message-content td::before {
                content: attr(data-label);
                color: #72e4c4;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.025em;
                text-transform: uppercase;
            }
            .message-content td:last-child {
                border-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>HTB Wiki Security Analyst</h1>
        <p style="color: #8e8ea0; margin-top: 5px; font-size: 14px;">Ask me questions about HackTheBox writeups</p>
    </div>

    <div class="chat-container" id="chat-container">
        <div class="message ai">
            <div class="avatar ai-avatar" aria-hidden="true">
                <span class="avatar-mark">AI<span class="avatar-spark"></span></span>
            </div>
            <div class="message-content">
                Hello! I am connected to the HTB RAG pipeline. How can I help you today? Try asking me one of your 15 test questions.
            </div>
        </div>
    </div>

    <div class="input-container">
        <div class="loading" id="loading">Thinking... (This may take a few seconds)</div>
        <div class="input-box">
            <input type="text" id="query-input" placeholder="e.g. Which machine has no modifiable services identified by winPEAS?" onkeypress="handleKeyPress(event)">
            <button onclick="sendQuery()">&#10148;</button>
        </div>
    </div>

    <script>
        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            input.value = '';
            
            addMessage('User', query, 'user');
            
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                
                const htmlAnswer = marked.parse(data.answer);
                addMessage('AI', htmlAnswer, 'ai', true);
            } catch (error) {
                addMessage('AI', 'Error connecting to the API. Make sure backend is running.', 'ai');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function addMessage(sender, text, type, isHtml = false) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = `avatar ${type}-avatar`;
            avatarDiv.setAttribute('aria-hidden', 'true');
            avatarDiv.innerHTML = sender === 'User'
                ? '<span class="avatar-mark">U</span>'
                : '<span class="avatar-mark">AI<span class="avatar-spark"></span></span>';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (isHtml) {
                contentDiv.innerHTML = text;
                enhanceRenderedContent(contentDiv);
            } else {
                contentDiv.innerText = text;
            }

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function enhanceRenderedContent(content) {
            content.querySelectorAll('table').forEach(table => {
                const labels = Array.from(table.querySelectorAll('thead th'))
                    .map(header => header.textContent.trim());

                table.querySelectorAll('tbody tr').forEach(row => {
                    Array.from(row.children).forEach((cell, index) => {
                        cell.dataset.label = labels[index] || `Column ${index + 1}`;
                    });
                });

                const wrapper = document.createElement('div');
                wrapper.className = 'table-scroll';
                table.parentNode.insertBefore(wrapper, table);
                wrapper.appendChild(table);
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendQuery();
            }
        }
    </script>
</body>
</html>
